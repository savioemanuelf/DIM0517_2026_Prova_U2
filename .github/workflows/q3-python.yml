name: Python
on:
  pull_request: 
    types: closed
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py
  create_tag:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: ls 
