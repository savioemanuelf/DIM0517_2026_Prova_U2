name: Python
on:
  workflow_dispatch: 
  
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: build
        run: docker build -t minha_imagem .
      - name: run
        run: docker run minha_imagem:latest
